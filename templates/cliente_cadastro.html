<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Cliente - Etisul</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="cliente-auth">
    <section class="auth-card auth-card-wide">
        <img src="{{ url_for('static', filename='img/logo-grande.png') }}" alt="Etisul">
        <h1>Criar conta de cliente</h1>
        {% if erro %}<div class="alerta-estoque">{{ erro }}</div>{% endif %}
        <form method="POST" class="form-produto">
            <input type="text" name="nome" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="text" name="telefone" placeholder="Telefone" required>
            <input type="text" name="cpf_cnpj" placeholder="CPF/CNPJ" required>
            <div class="form-duas-colunas">
                <input type="text" name="cidade" placeholder="Cidade" required>
                <input type="text" name="estado" placeholder="Estado" required>
            </div>
            <input type="text" name="cep" placeholder="CEP" required>
            <textarea name="endereco" placeholder="Endereço principal" rows="3"></textarea>
            <div class="campo-senha">
                <input type="password" id="cliente-cadastro-senha" name="senha" placeholder="Senha com letras e números" pattern="(?=.*[A-Za-z])(?=.*\d).+" title="Use letras e números." required>
                <button type="button" class="btn-olho" data-password-toggle="cliente-cadastro-senha" aria-label="Mostrar senha">&#128065;</button>
            </div>
            <p class="texto-seguranca">A senha precisa incluir letras e números.</p>
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já possui cadastro? <a href="/cliente/login">Entrar</a></p>
    </section>
</main>
<script src="{{ url_for('static', filename='js/senha-toggle.js') }}"></script>
</body>
</html>
