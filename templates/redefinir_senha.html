<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir senha - Etisul</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="cliente-auth">
    <section class="auth-card">
        <img src="{{ url_for('static', filename='img/logo-grande.png') }}" alt="Etisul">
        <h1>Redefinir senha</h1>
        {% if erro %}<p class="texto-erro-form">{{ erro }}</p>{% endif %}

        <form method="POST" action="/cliente/esqueci-senha" class="form-produto">
            <input type="email" name="email" placeholder="E-mail cadastrado" value="{{ email_digitado or '' }}" autocomplete="email" required>
            <div class="campo-senha">
                <input type="password" id="redefinir-senha" name="senha" placeholder="Nova senha com letras e números" value="{{ senha_digitada or '' }}" autocomplete="new-password" required>
                <button type="button" class="btn-olho" data-password-toggle="redefinir-senha" aria-label="Mostrar senha">&#128065;</button>
            </div>
            <div class="campo-senha">
                <input type="password" id="redefinir-confirmar-senha" name="confirmar_senha" placeholder="Confirmar nova senha" value="{{ confirmar_senha_digitada or '' }}" autocomplete="new-password" required>
                <button type="button" class="btn-olho" data-password-toggle="redefinir-confirmar-senha" aria-label="Mostrar senha">&#128065;</button>
            </div>
            <button type="submit">Salvar nova senha</button>
        </form>

        <a href="/cliente/login" class="btn-inicio">Voltar ao login</a>
    </section>
</main>
<script src="{{ url_for('static', filename='js/senha-toggle.js') }}"></script>
</body>
</html>
